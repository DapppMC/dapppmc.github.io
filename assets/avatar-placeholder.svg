  <rect x="6" y="22" width="1" height="1" fill="#4ade80"/>
  <rect x="25" y="20" width="1" height="1" fill="#f43f5e"/>
  <!-- Hair (Dark Pixel Style) -->
  <rect x="10" y="6" width="12" height="3" fill="#0f172a"/>
  <rect x="9" y="8" width="14" height="3" fill="#0f172a"/>
  <rect x="9" y="11" width="2" height="4" fill="#0f172a"/>
